<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namii Admin V_1.1 - Gestión de Centros Educativos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'namii-admin-app';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-api-key",
            authDomain: "demo-project.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:abcdef"
        };

        let db = null;
        let auth = null;
        let currentUser = null;

        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);

            const initAuth = async () => {
                try {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        const userCred = await signInWithCustomToken(auth, __initial_auth_token);
                        currentUser = userCred.user;
                    } else {
                        const userCred = await signInAnonymously(auth);
                        currentUser = userCred.user;
                    }
                    window.dbUser = currentUser;
                    setupRoomsSnapshot();
                    setupFamiliesSnapshot();
                    setupChildrenSnapshot();
                    setupLeadsSnapshot();
                    setupStaffSnapshot();
                    setupCentersSnapshot();
                } catch (err) {
                    console.error("Error initializing auth:", err);
                }
            };
            initAuth();
        } catch (e) {
            console.error("Firebase Initialization Error:", e);
        }

        function setupRoomsSnapshot() {
            if (!db || !currentUser) return;
            const roomsRef = collection(db, 'artifacts', appId, 'public', 'data', 'rooms');
            onSnapshot(roomsRef, (snapshot) => {
                const fetched = [];
                snapshot.forEach(docSnap => fetched.push(docSnap.data()));
                window.dispatchEvent(new CustomEvent('rooms-updated', { detail: fetched }));
            }, (err) => console.error("Firestore rooms listener error:", err));
        }

        window.saveRoomToFirestore = async (room) => {
            if (!db || !auth.currentUser) return;
            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', String(room.id));
                await setDoc(roomRef, JSON.parse(JSON.stringify(room)), { merge: true });
            } catch (e) { console.error("Error saving room:", e); }
        };

        window.deleteRoomFromFirestore = async (roomId) => {
            if (!db || !auth.currentUser) return;
            try {
                const roomRef = doc(db, 'artifacts', appId, 'public', 'data', 'rooms', String(roomId));
                await deleteDoc(roomRef);
            } catch (e) { console.error("Error deleting room:", e); }
        };

        function setupFamiliesSnapshot() {
            if (!db || !currentUser) return;
            const familiesRef = collection(db, 'artifacts', appId, 'public', 'data', 'families');
            onSnapshot(familiesRef, (snapshot) => {
                const fetched = [];
                snapshot.forEach(docSnap => fetched.push(docSnap.data()));
                window.dispatchEvent(new CustomEvent('families-updated', { detail: fetched }));
            }, (err) => console.error("Firestore families listener error:", err));
        }

        window.saveFamilyToFirestore = async (family) => {
            if (!db || !auth.currentUser) return;
            try {
                const familyRef = doc(db, 'artifacts', appId, 'public', 'data', 'families', String(family.id));
                await setDoc(familyRef, JSON.parse(JSON.stringify(family)), { merge: true });
            } catch (e) { console.error("Error saving family:", e); }
        };

        function setupChildrenSnapshot() {
            if (!db || !currentUser) return;
            const childrenRef = collection(db, 'artifacts', appId, 'public', 'data', 'children');
            onSnapshot(childrenRef, (snapshot) => {
                const fetched = [];
                snapshot.forEach(docSnap => fetched.push(docSnap.data()));
                window.dispatchEvent(new CustomEvent('children-updated', { detail: fetched }));
            }, (err) => console.error("Firestore children listener error:", err));
        }

        window.saveChildToFirestore = async (child) => {
            if (!db || !auth.currentUser) return;
            try {
                const childRef = doc(db, 'artifacts', appId, 'public', 'data', 'children', String(child.id));
                await setDoc(childRef, JSON.parse(JSON.stringify(child)), { merge: true });
            } catch (e) { console.error("Error saving child:", e); }
        };

        function setupLeadsSnapshot() {
            if (!db || !currentUser) return;
            const leadsRef = collection(db, 'artifacts', appId, 'public', 'data', 'leads');
            onSnapshot(leadsRef, (snapshot) => {
                const fetched = [];
                snapshot.forEach(docSnap => fetched.push(docSnap.data()));
                window.dispatchEvent(new CustomEvent('leads-updated', { detail: fetched }));
            }, (err) => console.error("Firestore leads listener error:", err));
        }

        window.saveLeadToFirestore = async (lead) => {
            if (!db || !auth.currentUser) return;
            try {
                const leadRef = doc(db, 'artifacts', appId, 'public', 'data', 'leads', String(lead.id));
                await setDoc(leadRef, JSON.parse(JSON.stringify(lead)), { merge: true });
            } catch (e) { console.error("Error saving lead:", e); }
        };

        window.deleteLeadFromFirestore = async (leadId) => {
            if (!db || !auth.currentUser) return;
            try {
                const leadRef = doc(db, 'artifacts', appId, 'public', 'data', 'leads', String(leadId));
                await deleteDoc(leadRef);
            } catch (e) { console.error("Error deleting lead:", e); }
        };

        function setupStaffSnapshot() {
            if (!db || !currentUser) return;
            const staffRef = collection(db, 'artifacts', appId, 'public', 'data', 'staff');
            onSnapshot(staffRef, (snapshot) => {
                const fetched = [];
                snapshot.forEach(docSnap => fetched.push(docSnap.data()));
                window.dispatchEvent(new CustomEvent('staff-updated', { detail: fetched }));
            }, (err) => console.error("Firestore staff listener error:", err));
        }

        window.saveStaffToFirestore = async (st) => {
            if (!db || !auth.currentUser) return;
            try {
                const staffRef = doc(db, 'artifacts', appId, 'public', 'data', 'staff', String(st.id));
                await setDoc(staffRef, JSON.parse(JSON.stringify(st)), { merge: true });
            } catch (e) { console.error("Error saving staff:", e); }
        };

        function setupCentersSnapshot() {
            if (!db || !currentUser) return;
            const centersRef = collection(db, 'artifacts', appId, 'public', 'data', 'centers');
            onSnapshot(centersRef, (snapshot) => {
                const fetched = [];
                snapshot.forEach(docSnap => fetched.push(docSnap.data()));
                window.dispatchEvent(new CustomEvent('centers-updated', { detail: fetched }));
            }, (err) => console.error("Firestore centers listener error:", err));
        }

        window.saveCenterToFirestore = async (center) => {
            if (!db || !auth.currentUser) return;
            try {
                const centerRef = doc(db, 'artifacts', appId, 'public', 'data', 'centers', String(center.id));
                await setDoc(centerRef, JSON.parse(JSON.stringify(center)), { merge: true });
            } catch (e) { console.error("Error saving center:", e); }
        };
    </script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        nami: {
                            50: '#f0fdfa',
                            100: '#ccfbf1',
                            200: '#99f6e4',
                            500: '#14b8a6',
                            600: '#0d9488',
                            700: '#0f766e',
                            800: '#115e59',
                            sidebar: '#165a6e',
                            sidebarHover: '#1c6d85',
                            sidebarActive: '#227f9b',
                            bg: '#e8f4f4'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        .dot-pattern {
            background-color: #eaf3f3;
            background-image: radial-gradient(#b2d8d8 0.85px, transparent 0.85px);
            background-size: 16px 16px;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(150, 180, 185, 0.4);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(100, 150, 160, 0.6);
        }

        [x-cloak] { display: none !important; }
    </style>
</head>

<body class="h-full font-sans antialiased text-slate-800 bg-slate-100 overflow-hidden" 
      x-data="namiApp()" 
      x-init="initApp()" 
      @keydown.window.cmd.k.prevent="isSearchOpen = true" 
      @keydown.window.ctrl.k.prevent="isSearchOpen = true">

    <div class="flex h-screen w-full overflow-hidden">

        <!-- ================= SIDEBAR ================= -->
        <aside class="w-64 bg-nami-sidebar text-teal-50 flex flex-col justify-between shrink-0 select-none shadow-xl transition-all duration-300 z-30">
            <div class="flex flex-col h-full overflow-y-auto">
                <div class="flex items-center justify-between px-5 py-4 border-b border-teal-800/40">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-9 h-9 rounded-xl bg-teal-400/20 flex items-center justify-center text-teal-200 border border-teal-300/30 shadow-inner">
                            <i data-lucide="baby" class="w-5 h-5 text-teal-300"></i>
                        </div>
                        <div class="flex flex-col">
                            <span class="text-xl font-bold tracking-tight text-white leading-none">Namii</span>
                            <span class="text-[10px] font-semibold text-teal-300 tracking-wider mt-0.5">ADMIN V_1.1</span>
                        </div>
                    </div>
                    <button @click="showToast('Sin nuevas notificaciones')" class="p-1.5 hover:bg-teal-800/50 rounded-lg text-teal-200 transition" title="Notificaciones">
                        <i data-lucide="bell" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="px-3.5 pt-4 pb-2 space-y-2">
                    <button @click="isSearchOpen = true" class="w-full bg-teal-800/40 hover:bg-teal-800/60 text-teal-200/90 text-xs py-2 px-3 rounded-lg flex items-center justify-between border border-teal-700/50 transition">
                        <span class="flex items-center"><i data-lucide="search" class="w-3.5 h-3.5 mr-2"></i> Buscar</span>
                        <kbd class="bg-teal-900/60 text-[10px] text-teal-300 px-1.5 py-0.5 rounded border border-teal-700/40 font-mono">Ctrl+K</kbd>
                    </button>
                </div>

                <nav class="px-2 py-2 space-y-0.5 text-xs font-medium text-teal-100/90 flex-1">
                    <a href="#" @click.prevent="currentView = 'dashboard'" 
                       :class="currentView === 'dashboard' ? 'bg-nami-sidebarActive text-white font-semibold shadow-sm' : 'hover:bg-teal-800/40 text-teal-100/80'" 
                       class="flex items-center px-3 py-2 rounded-lg transition group">
                        <i data-lucide="layout-grid" class="w-4 h-4 mr-2.5 text-teal-300"></i>
                        <span>Panel</span>
                    </a>

                    <div class="pt-1 space-y-0.5">
                        <button @click="isOrgOpen = !isOrgOpen" 
                                class="w-full flex items-center justify-between px-3 py-2 rounded-lg text-teal-100/90 hover:bg-teal-800/40 transition group">
                            <span class="flex items-center font-medium">
                                <i data-lucide="building-2" class="w-4 h-4 mr-2.5 text-teal-300"></i>
                                <span>Organización</span>
                            </span>
                            <i data-lucide="chevron-down" 
                               class="w-3.5 h-3.5 text-teal-300/80 transition-transform duration-200"
                               :class="isOrgOpen ? 'rotate-180' : ''"></i>
                        </button>

                        <div x-show="isOrgOpen" x-transition class="pl-3 space-y-0.5 pt-0.5 border-l-2 border-teal-700/50 ml-4">
                            <a href="#" @click.prevent="currentView = 'centers'" 
                               :class="currentView === 'centers' ? 'bg-nami-sidebarActive text-white font-semibold shadow-sm' : 'hover:bg-teal-800/40 text-teal-100/80'" 
                               class="flex items-center px-3 py-1.5 rounded-lg transition text-xs">
                                <i data-lucide="building" class="w-3.5 h-3.5 mr-2 text-teal-300"></i>
                                <span>Centros</span>
                            </a>

                            <a href="#" @click.prevent="currentView = 'rooms'" 
                               :class="currentView === 'rooms' ? 'bg-nami-sidebarActive text-white font-semibold shadow-sm' : 'hover:bg-teal-800/40 text-teal-100/80'" 
                               class="flex items-center px-3 py-1.5 rounded-lg transition text-xs">
                                <i data-lucide="shapes" class="w-3.5 h-3.5 mr-2 text-teal-300"></i>
                                <span>Grupos</span>
                            </a>
                        </div>
                    </div>

                    <a href="#" @click.prevent="currentView = 'children'" 
                       :class="currentView === 'children' ? 'bg-nami-sidebarActive text-white font-semibold shadow-sm' : 'hover:bg-teal-800/40 text-teal-100/80'" 
                       class="flex items-center px-3 py-2 rounded-lg transition">
                        <i data-lucide="users" class="w-4 h-4 mr-2.5 text-teal-300"></i>
                        <span>Familias y Niños</span>
                    </a>

                    <a href="#" @click.prevent="currentView = 'crm'" 
                       :class="currentView === 'crm' ? 'bg-nami-sidebarActive text-white font-semibold shadow-sm' : 'hover:bg-teal-800/40 text-teal-100/80'" 
                       class="flex items-center px-3 py-2 rounded-lg transition">
                        <i data-lucide="user-plus" class="w-4 h-4 mr-2.5 text-teal-300"></i>
                        <span>Admisiones y CRM</span>
                    </a>
                </nav>
            </div>

            <div class="p-3 border-t border-teal-800/40 bg-teal-950/20">
                <div class="bg-teal-800/30 hover:bg-teal-800/50 p-2.5 rounded-xl flex items-center justify-between border border-teal-700/30 transition">
                    <div class="flex items-center space-x-2.5">
                        <div class="w-8 h-8 rounded-full bg-slate-300 text-slate-700 font-bold flex items-center justify-center text-xs shadow-inner">
                            AD
                        </div>
                        <div class="overflow-hidden">
                            <h4 class="text-xs font-semibold text-white truncate leading-tight">Administrador</h4>
                            <div class="flex items-center space-x-1 mt-0.5">
                                <span class="bg-amber-500/80 text-amber-950 font-semibold text-[9px] px-1.5 py-0.2 rounded">Superadmin</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- MAIN CONTAINER -->
        <main class="flex-1 flex flex-col min-w-0 h-full overflow-hidden dot-pattern relative">

            <!-- ================= VIEW: DASHBOARD ================= -->
            <template x-if="currentView === 'dashboard'">
                <div class="flex-1 flex flex-col h-full overflow-y-auto p-6 md:p-8 space-y-6">
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white/70 backdrop-blur-md p-6 rounded-2xl border border-teal-100/80 shadow-sm">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Panel de Control</h1>
                            <p class="text-xs text-slate-500 mt-0.5">Resumen general de tu centro educativo (Namii Admin V_1.1)</p>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button @click="currentView = 'children'" class="bg-teal-700 hover:bg-teal-800 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-sm transition">
                                Ver Alumnos
                            </button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-2xs flex items-center justify-between">
                            <div>
                                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Total Niños</span>
                                <span class="text-2xl font-bold text-slate-800 mt-1 block" x-text="children.length"></span>
                            </div>
                            <div class="w-12 h-12 rounded-2xl bg-teal-50 text-teal-700 flex items-center justify-center">
                                <i data-lucide="baby" class="w-6 h-6"></i>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-2xs flex items-center justify-between">
                            <div>
                                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Grupos Activos</span>
                                <span class="text-2xl font-bold text-slate-800 mt-1 block" x-text="rooms.length"></span>
                            </div>
                            <div class="w-12 h-12 rounded-2xl bg-indigo-50 text-indigo-700 flex items-center justify-center">
                                <i data-lucide="shapes" class="w-6 h-6"></i>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-2xs flex items-center justify-between">
                            <div>
                                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Familias</span>
                                <span class="text-2xl font-bold text-slate-800 mt-1 block" x-text="families.length"></span>
                            </div>
                            <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-700 flex items-center justify-center">
                                <i data-lucide="users" class="w-6 h-6"></i>
                            </div>
                        </div>

                        <div class="bg-white p-5 rounded-2xl border border-slate-200/80 shadow-2xs flex items-center justify-between">
                            <div>
                                <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider block">Prospectos CRM</span>
                                <span class="text-2xl font-bold text-slate-800 mt-1 block" x-text="leads.length"></span>
                            </div>
                            <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-700 flex items-center justify-center">
                                <i data-lucide="user-plus" class="w-6 h-6"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- ================= VIEW: GRUPOS ================= -->
            <template x-if="currentView === 'rooms'">
                <div class="flex-1 flex flex-col h-full overflow-y-auto p-6 md:p-8 space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white/80 backdrop-blur-md p-6 rounded-2xl border border-teal-100/80 shadow-sm">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Grupos</h1>
                            <p class="text-xs text-slate-500 mt-0.5">Gestión de salas de estimulación, cupos, personal asignado y alumnos inscritos</p>
                        </div>
                        <button @click="openAddRoomModal()" class="inline-flex items-center justify-center bg-teal-700 hover:bg-teal-800 text-white text-xs font-semibold px-4 py-2.5 rounded-xl shadow-md shadow-teal-700/20 transition duration-150 transform active:scale-95">
                            <i data-lucide="plus" class="w-4 h-4 mr-1.5"></i> + Agregar Grupo
                        </button>
                    </div>

                    <div class="bg-white/80 p-3 rounded-2xl border border-slate-200/80 shadow-2xs flex items-center">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-2"></i>
                        <input type="text" x-model="roomSearchQuery" placeholder="Buscar grupo por nombre o rango de edad..." class="w-full bg-transparent text-xs focus:outline-none">
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        <template x-for="room in filteredRoomsList" :key="room.id">
                            <div class="bg-white/90 rounded-2xl border border-slate-200/90 shadow-2xs p-5 flex flex-col justify-between hover:shadow-md transition space-y-4">
                                <div class="flex items-start justify-between">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-10 h-10 rounded-2xl bg-teal-50 text-teal-700 border border-teal-100 flex items-center justify-center font-bold">
                                            <i data-lucide="shapes" class="w-5 h-5"></i>
                                        </div>
                                        <div>
                                            <h3 class="font-bold text-slate-800 text-base" x-text="room.name"></h3>
                                            <div class="flex items-center space-x-2 text-xs text-slate-500 font-medium mt-0.5">
                                                <span class="flex items-center space-x-1">
                                                    <i data-lucide="users" class="w-3.5 h-3.5 text-teal-600"></i>
                                                    <span class="font-bold text-slate-700" x-text="getRoomEnrolledChildren(room).length + ' / ' + room.capacity + ' inscritos'"></span>
                                                </span>
                                                <span class="bg-teal-50 text-teal-800 text-[10px] font-semibold px-2 py-0.5 rounded border border-teal-200" x-text="room.ageGroup || 'Cualquier edad'"></span>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="flex items-center space-x-1">
                                        <button @click="openEditRoomModal(room)" class="p-1.5 text-slate-400 hover:text-teal-700 hover:bg-slate-100 rounded-lg transition" title="Editar Grupo">
                                            <i data-lucide="pencil" class="w-4 h-4"></i>
                                        </button>
                                        <button @click="confirmDeleteRoom(room)" class="p-1.5 text-slate-400 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition" title="Eliminar Grupo">
                                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                                        </button>
                                    </div>
                                </div>

                                <div class="space-y-2 pt-3 border-t border-slate-100 text-xs">
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider block">PERSONAL ASIGNADO (STAFF)</span>
                                    
                                    <div class="space-y-1.5">
                                        <template x-for="st in getRoomStaff(room)" :key="st.id">
                                            <div class="p-2 bg-slate-50 rounded-xl border border-slate-200/60 flex items-center justify-between">
                                                <div class="flex items-center space-x-2">
                                                    <div class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-800 font-bold flex items-center justify-center text-[10px]" x-text="st.name ? st.name.charAt(0) : 'S'"></div>
                                                    <div>
                                                        <span class="font-semibold text-slate-800 text-xs block leading-tight" x-text="st.name + ' ' + (st.firstLastName || '')"></span>
                                                        <span class="text-[9px] text-slate-400 block" x-text="st.role"></span>
                                                    </div>
                                                </div>
                                                <button @click="unassignStaffFromRoom(room, st.id)" class="p-1 text-slate-400 hover:text-rose-600" title="Quitar">
                                                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                                                </button>
                                            </div>
                                        </template>

                                        <template x-if="!room.staffIds || room.staffIds.length === 0">
                                            <div class="p-2.5 bg-slate-50/70 rounded-xl border border-dashed border-slate-200 text-center text-[11px] text-slate-400 font-medium">
                                                No hay personal asignado
                                            </div>

    <script>
        function namiApp() {
            return {
                currentView: 'dashboard',
                childrenTab: 'familia',
                isOrgOpen: true,
                isSearchOpen: false,

                // Modales
                isAddRoomModalOpen: false,
                isAssignStaffModalOpen: false,
                isEnrollChildModalOpen: false,
                isAddFamilyModalOpen: false,
                isAddChildModalOpen: false,
                isAddLeadModalOpen: false,
                isAddCenterModalOpen: false,
                isChildDrawerOpen: false,
                isLeadDrawerOpen: false,

                // CRM States
                crmViewMode: 'board',
                crmTimeFilter: 'week',
                leadSearchQuery: '',
                draggedLeadId: null,
                selectedLeadForDrawer: null,
                leadDrawerTab: 'overview',
                leadActivityInput: '',

                leadForm: {
                    id: null,
                    childName: '',
                    childFirstLastName: '',
                    childSecondLastName: '',
                    parentName: '',
                    parentFirstLastName: '',
                    parentSecondLastName: '',
                    email: '',
                    phone: '',
                    dob: '',
                    ageCalc: '',
                    stageId: 'contacted',
                    createdAt: 'hace un momento'
                },

                familyForm: {
                    id: null,
                    name: '',
                    nameInput: '',
                    firstLastNameInput: '',
                    secondLastNameInput: '',
                    email: '',
                    phone: ''
                },

                childForm: {
                    id: null,
                    name: '',
                    firstLastName: '',
                    secondLastName: '',
                    familyId: '',
                    dob: '',
                    age: '',
                    gender: 'Niño',
                    roomId: null,
                    roomName: null,
                    archived: false
                },

                centerForm: {
                    id: null,
                    name: '',
                    location: ''
                },

                editingRoom: null,
                targetRoomForStaff: null,
                targetRoomForChild: null,

                roomForm: {
                    id: null,
                    name: '',
                    ageGroup: '',
                    capacity: 35,
                    ratio: '1:6',
                    staffIds: [],
                    enrolledChildIds: []
                },

                roomSearchQuery: '',
                familySearchQuery: '',
                childSearchQuery: '',
                childStatusFilter: 'active',

                selectedChildForDrawer: null,
                childDrawerTab: 'info',

                toast: { visible: false, message: '' },

                centers: [],
                staff: [],
                rooms: [],
                families: [],
                children: [],
                leads: [],

                crmStages: [
                    { id: 'contacted', name: 'CONTACTADO', dotColor: 'bg-blue-500', barColor: 'bg-blue-500' },
                    { id: 'schedule_sample', name: 'AGENDAR CLASE MUESTRA', dotColor: 'bg-purple-500', barColor: 'bg-purple-500' },
                    { id: 'sample_class', name: 'CLASE MUESTRA', dotColor: 'bg-indigo-500', barColor: 'bg-indigo-500' },
                    { id: 'pending', name: 'PENDIENTE', dotColor: 'bg-amber-500', barColor: 'bg-amber-500' },
                    { id: 'enrolled', name: 'INSCRITO', dotColor: 'bg-emerald-500', barColor: 'bg-emerald-500' },
                    { id: 'lost', name: 'PERDIDO', dotColor: 'bg-rose-500', barColor: 'bg-rose-500' }
                ],

                get filteredLeadsList() {
                    if (!this.leadSearchQuery) return this.leads;
                    const query = this.leadSearchQuery.toLowerCase();
                    return this.leads.filter(l => 
                        (l.childName && l.childName.toLowerCase().includes(query)) ||
                        (l.parentName && l.parentName.toLowerCase().includes(query)) ||
                        (l.phone && l.phone.includes(query)) ||
                        (l.email && l.email.toLowerCase().includes(query))
                    );
                },

                getStageName(stageId) {
                    const st = this.crmStages.find(s => s.id === stageId);
                    return st ? st.name : 'CONTACTADO';
                },

                getLeadsByStage(stageId) {
                    return this.filteredLeadsList.filter(l => l.stageId === stageId);
                },

                getFunnelCount(stageId) {
                    return this.leads.filter(l => l.stageId === stageId).length;
                },

                getFunnelWidth(stageId) {
                    const count = this.getFunnelCount(stageId);
                    if (this.leads.length === 0) return 0;
                    return Math.min(Math.round((count / this.leads.length) * 100), 100);
                },

                getFunnelPct(stageId) {
                    if (this.leads.length === 0) return 0;
                    return Math.round((this.getFunnelCount(stageId) / this.leads.length) * 100);
                },

                openLeadDrawer(lead) {
                    if (!lead) return;
                    this.selectedLeadForDrawer = lead;
                    if (!this.selectedLeadForDrawer.activities) {
                        this.selectedLeadForDrawer.activities = [];
                    }
                    this.leadDrawerTab = 'overview';
                    this.isLeadDrawerOpen = true;
                    this.refreshIcons();
                },

                updateLeadFromDrawer() {
                    if (this.selectedLeadForDrawer) {
                        if (window.saveLeadToFirestore) window.saveLeadToFirestore(this.selectedLeadForDrawer);
                        this.showToast('Prospecto actualizado');
                    }
                },

                submitLeadActivity() {
                    if (!this.leadActivityInput.trim()) return;
                    this.logLeadActivity(this.leadActivityInput.trim());
                    this.leadActivityInput = '';
                },

                logLeadActivity(text) {
                    if (!this.selectedLeadForDrawer) return;
                    if (!this.selectedLeadForDrawer.activities) {
                        this.selectedLeadForDrawer.activities = [];
                    }
                    this.selectedLeadForDrawer.activities.unshift({
                        author: 'Administrador',
                        timestamp: 'hace un momento',
                        text: text
                    });
                    if (window.saveLeadToFirestore) window.saveLeadToFirestore(this.selectedLeadForDrawer);
                    this.showToast('Actividad registrada');
                },

                calculateChildAge(form) {
                    if (!form.dob) return;
                    const birthDate = new Date(form.dob);
                    const today = new Date();
                    let months = (today.getFullYear() - birthDate.getFullYear()) * 12 + (today.getMonth() - birthDate.getMonth());
                    if (today.getDate() < birthDate.getDate()) months--;
                    if (months < 0) months = 0;

                    if (months < 12) {
                        form.age = `${months} meses`;
                    } else {
                        const years = Math.floor(months / 12);
                        const remMonths = months % 12;
                        form.age = remMonths > 0 ? `${years} años ${remMonths}m` : `${years} años`;
                    }
                },

                calculateLeadAge(form) {
                    if (!form.dob) return;
                    const birthDate = new Date(form.dob);
                    const today = new Date();
                    let months = (today.getFullYear() - birthDate.getFullYear()) * 12 + (today.getMonth() - birthDate.getMonth());
                    if (today.getDate() < birthDate.getDate()) months--;
                    if (months < 0) months = 0;

                    if (months < 12) {
                        form.ageCalc = `${months} meses`;
                    } else {
                        const years = Math.floor(months / 12);
                        const remMonths = months % 12;
                        form.ageCalc = remMonths > 0 ? `${years} años ${remMonths}m` : `${years} años`;
                    }
                },

                openAddLeadModal() {
                    this.leadForm = {
                        id: Date.now(),
                        childName: '',
                        childFirstLastName: '',
                        childSecondLastName: '',
                        parentName: '',
                        parentFirstLastName: '',
                        parentSecondLastName: '',
                        email: '',
                        phone: '',
                        dob: '',
                        ageCalc: '',
                        stageId: 'contacted',
                        createdAt: 'hace un momento'
                    };
                    this.isAddLeadModalOpen = true;
                },

                saveLeadModal() {
                    if (!this.leadForm.childName.trim() && !this.leadForm.parentName.trim()) {
                        this.showToast('Ingresa al menos un nombre');
                        return;
                    }

                    const newLead = { ...this.leadForm };
                    this.leads.push(newLead);
                    if (window.saveLeadToFirestore) window.saveLeadToFirestore(newLead);

                    this.isAddLeadModalOpen = false;
                    this.showToast('Nuevo prospecto registrado');
                    this.refreshIcons();
                },

                moveLeadStage(lead, newStageId) {
                    lead.stageId = newStageId;
                    if (window.saveLeadToFirestore) window.saveLeadToFirestore(lead);
                    this.showToast('Etapa del prospecto actualizada');
                },

                dropLeadToStage(targetStageId) {
                    if (!this.draggedLeadId) return;
                    const lead = this.leads.find(l => String(l.id) === String(this.draggedLeadId));
                    if (lead && lead.stageId !== targetStageId) {
                        lead.stageId = targetStageId;
                        if (window.saveLeadToFirestore) window.saveLeadToFirestore(lead);
                        this.showToast('Etapa del prospecto actualizada');
                    }
                    this.draggedLeadId = null;
                },

                deleteLead(lead) {
                    if (confirm(`¿Eliminar prospecto "${lead.childName || lead.parentName}"?`)) {
                        this.leads = this.leads.filter(l => l.id !== lead.id);
                        if (window.deleteLeadFromFirestore) window.deleteLeadFromFirestore(lead.id);
                        this.showToast('Prospecto eliminado');
                    }
                },

                openAddFamilyModal() {
                    this.familyForm = {
                        id: Date.now(),
                        name: '',
                        nameInput: '',
                        firstLastNameInput: '',
                        secondLastNameInput: '',
                        email: '',
                        phone: ''
                    };
                    this.isAddFamilyModalOpen = true;
                },

                saveFamilyModal() {
                    if (!this.familyForm.name.trim()) {
                        this.showToast('Ingresa el nombre de la familia');
                        return;
                    }
                    const newFam = { ...this.familyForm };
                    this.families.push(newFam);
                    if (window.saveFamilyToFirestore) window.saveFamilyToFirestore(newFam);
                    this.isAddFamilyModalOpen = false;
                    this.showToast('Familia registrada correctamente');
                    this.refreshIcons();
                },

                openAddChildModal() {
                    this.childForm = {
                        id: Date.now(),
                        name: '',
                        firstLastName: '',
                        secondLastName: '',
                        familyId: '',
                        dob: '',
                        age: '',
                        gender: 'Niño',
                        roomId: null,
                        roomName: null,
                        archived: false
                    };
                    this.isAddChildModalOpen = true;
                },

                saveChildModal() {
                    if (!this.childForm.name.trim()) {
                        this.showToast('Ingresa el nombre del niño');
                        return;
                    }
                    const fam = this.families.find(f => String(f.id) === String(this.childForm.familyId));
                    const newChild = {
                        ...this.childForm,
                        parentName: fam ? `${fam.nameInput} ${fam.firstLastNameInput || ''}` : 'Tutor general'
                    };
                    this.children.push(newChild);
                    if (window.saveChildToFirestore) window.saveChildToFirestore(newChild);
                    this.isAddChildModalOpen = false;
                    this.showToast('Niño registrado correctamente');
                    this.refreshIcons();
                },

                openAddCenterModal() {
                    this.centerForm = { id: Date.now(), name: '', location: '' };
                    this.isAddCenterModalOpen = true;
                },

                saveCenterModal() {
                    if (!this.centerForm.name.trim()) {
                        this.showToast('Ingresa el nombre del centro');
                        return;
                    }
                    const newCenter = { ...this.centerForm };
                    this.centers.push(newCenter);
                    if (window.saveCenterToFirestore) window.saveCenterToFirestore(newCenter);
                    this.isAddCenterModalOpen = false;
                    this.showToast('Centro educativo registrado');
                    this.refreshIcons();
                },

                initApp() {
                    window.addEventListener('rooms-updated', (e) => {
                        if (e.detail && Array.isArray(e.detail)) {
                            this.rooms = e.detail;
                            this.refreshIcons();
                        }
                    });

                    window.addEventListener('families-updated', (e) => {
                        if (e.detail && Array.isArray(e.detail)) {
                            this.families = e.detail;
                            this.refreshIcons();
                        }
                    });

                    window.addEventListener('children-updated', (e) => {
                        if (e.detail && Array.isArray(e.detail)) {
                            this.children = e.detail;
                            this.refreshIcons();
                        }
                    });

                    window.addEventListener('leads-updated', (e) => {
                        if (e.detail && Array.isArray(e.detail)) {
                            this.leads = e.detail;
                            this.refreshIcons();
                        }
                    });

                    window.addEventListener('staff-updated', (e) => {
                        if (e.detail && Array.isArray(e.detail)) {
                            this.staff = e.detail;
                            this.refreshIcons();
                        }
                    });

                    window.addEventListener('centers-updated', (e) => {
                        if (e.detail && Array.isArray(e.detail)) {
                            this.centers = e.detail;
                            this.refreshIcons();
                        }
                    });

                    this.$nextTick(() => this.refreshIcons());
                    this.$watch('currentView', () => this.refreshIcons());
                    this.$watch('childrenTab', () => this.refreshIcons());
                },

                refreshIcons() {
                    this.$nextTick(() => {
                        if (window.lucide) lucide.createIcons();
                    });
                },

                get filteredRoomsList() {
                    if (!this.roomSearchQuery) return this.rooms;
                    return this.rooms.filter(r => 
                        r.name.toLowerCase().includes(this.roomSearchQuery.toLowerCase()) || 
                        (r.ageGroup && r.ageGroup.toLowerCase().includes(this.roomSearchQuery.toLowerCase()))
                    );
                },

                openAddRoomModal() {
                    this.editingRoom = null;
                    this.roomForm = {
                        id: Date.now(),
                        name: '',
                        ageGroup: '',
                        capacity: 35,
                        ratio: '1:6',
                        staffIds: [],
                        enrolledChildIds: []
                    };
                    this.isAddRoomModalOpen = true;
                },

                openEditRoomModal(room) {
                    this.editingRoom = room;
                    this.roomForm = JSON.parse(JSON.stringify(room));
                    this.isAddRoomModalOpen = true;
                },

                saveRoomModal() {
                    if (!this.roomForm.name.trim()) {
                        this.showToast('Por favor escribe un nombre para el grupo');
                        return;
                    }

                    if (this.editingRoom) {
                        Object.assign(this.editingRoom, this.roomForm);
                        if (window.saveRoomToFirestore) window.saveRoomToFirestore(this.editingRoom);
                        this.showToast('Grupo actualizado correctamente');
                    } else {
                        const newRoom = { ...this.roomForm };
                        this.rooms.push(newRoom);
                        if (window.saveRoomToFirestore) window.saveRoomToFirestore(newRoom);
                        this.showToast('Nuevo grupo creado');
                    }

                    this.isAddRoomModalOpen = false;
                    this.refreshIcons();
                },

                confirmDeleteRoom(room) {
                    if (confirm(`¿Estás seguro de eliminar el grupo "${room.name}"?`)) {
                        this.rooms = this.rooms.filter(r => r.id !== room.id);
                        if (window.deleteRoomFromFirestore) window.deleteRoomFromFirestore(room.id);
                        this.showToast('Grupo eliminado');
                    }
                },

                getRoomStaff(room) {
                    if (!room.staffIds) return [];
                    return this.staff.filter(s => room.staffIds.includes(s.id));
                },

                openAssignStaffModal(room) {
                    this.targetRoomForStaff = room;
                    this.isAssignStaffModalOpen = true;
                },

                assignStaffToRoom(room, staffId) {
                    if (!room.staffIds) room.staffIds = [];
                    if (!room.staffIds.includes(staffId)) {
                        room.staffIds.push(staffId);
                        if (window.saveRoomToFirestore) window.saveRoomToFirestore(room);
                        this.showToast('Personal asignado al grupo');
                    }
                    this.isAssignStaffModalOpen = false;
                    this.refreshIcons();
                },

                unassignStaffFromRoom(room, staffId) {
                    if (!room.staffIds) return;
                    room.staffIds = room.staffIds.filter(id => id !== staffId);
                    if (window.saveRoomToFirestore) window.saveRoomToFirestore(room);
                    this.showToast('Personal desasignado');
                    this.refreshIcons();
                },

                getRoomEnrolledChildren(room) {
                    return this.children.filter(c => 
                        (room.enrolledChildIds && room.enrolledChildIds.includes(c.id)) || 
                        c.roomId === room.id || 
                        c.roomName === room.name
                    );
                },

                openEnrollChildModal(room) {
                    this.targetRoomForChild = room;
                    this.isEnrollChildModalOpen = true;
                },

                enrollChildToRoom(room, childId) {
                    const child = this.children.find(c => c.id === childId);
                    if (child) {
                        child.roomId = room.id;
                        child.roomName = room.name;
                        if (!room.enrolledChildIds) room.enrolledChildIds = [];
                        if (!room.enrolledChildIds.includes(childId)) {
                            room.enrolledChildIds.push(childId);
                        }
                        if (window.saveChildToFirestore) window.saveChildToFirestore(child);
                        if (window.saveRoomToFirestore) window.saveRoomToFirestore(room);
                        this.showToast(`${child.name} inscrito en ${room.name}`);
                    }
                    this.isEnrollChildModalOpen = false;
                    this.refreshIcons();
                },

                unenrollChildFromRoom(room, childId) {
                    const child = this.children.find(c => c.id === childId);
                    if (child) {
                        child.roomId = null;
                        child.roomName = null;
                        if (window.saveChildToFirestore) window.saveChildToFirestore(child);
                    }
                    if (room.enrolledChildIds) {
                        room.enrolledChildIds = room.enrolledChildIds.filter(id => id !== childId);
                        if (window.saveRoomToFirestore) window.saveRoomToFirestore(room);
                    }
                    this.showToast('Alumno dado de baja del grupo');
                    this.refreshIcons();
                },

                get filteredFamiliesList() {
                    if (!this.familySearchQuery) return this.families;
                    return this.families.filter(f => f.name.toLowerCase().includes(this.familySearchQuery.toLowerCase()) || f.nameInput.toLowerCase().includes(this.familySearchQuery.toLowerCase()));
                },

                get filteredChildrenList() {
                    return this.children.filter(c => {
                        const matchesQuery = !this.childSearchQuery || c.name.toLowerCase().includes(this.childSearchQuery.toLowerCase()) || (c.parentName && c.parentName.toLowerCase().includes(this.childSearchQuery.toLowerCase()));
                        const matchesStatus = this.childStatusFilter === 'archived' ? c.archived : !c.archived;
                        return matchesQuery && matchesStatus;
                    });
                },

                getChildrenForFamily(familyId) {
                    return this.children.filter(c => String(c.familyId) === String(familyId));
                },

                openChildDrawer(child) {
                    this.selectedChildForDrawer = child;
                    this.childDrawerTab = 'info';
                    this.isChildDrawerOpen = true;
                    this.refreshIcons();
                },

                archiveChild(child) {
                    child.archived = true;
                    if (window.saveChildToFirestore) window.saveChildToFirestore(child);
                    this.showToast('Alumno archivado correctamente');
                },

                showToast(msg) {
                    this.toast.message = msg;
                    this.toast.visible = true;
                    setTimeout(() => { this.toast.visible = false; }, 3000);
                }
            };
        }
    </script>
</body>
</html>
